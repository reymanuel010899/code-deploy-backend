AWSTemplateFormatVersion: '2010-09-09'
Description: ECS Fargate Cluster usando VPC y subnets existentes

Parameters:
  VPCId:
    Type: String
    Default: vpc-0d1125fbea39e69f4

  PublicSubnetId:
    Type: String
    Default: subnet-08739eb429d2fabe8

  PrivateSubnetId:
    Type: String
    Default: subnet-02ad64779efe7a82d

  ClusterName:
    Type: String
    Description: Nombre de la definición de tarea

  TaskName:
    Type: String
    Description: Nombre de la definición de tarea

  Image1:
    Type: String
    Description: Imagen contenedor 1

  Image2:
    Type: String
    Description: Imagen contenedor 2

  Image3:
    Type: String
    Description: Imagen contenedor 3

  Cpu:
    Type: String
    AllowedValues: ['256', '512', '1024', '2048', '4096']
    Description: CPU para la tarea

  # Memory for the task in MB
  CpuContainer1:
    Type: String
    AllowedValues: ['128','256', '512', '1024', '2048', '4096']
    Description: CPU (en unidades) para el contenedor 1

  CpuContainer2:
    Type: String
    AllowedValues: ['128','256', '512', '1024', '2048', '4096']
    Description: CPU (en unidades) para el contenedor 2 

  CpuContainer3:
    Type: String
    AllowedValues: ['128','256', '512', '1024', '2048', '4096']
    Description: CPU (en unidades) para el contenedor 3

  MemoryContainer1:
    Type: String
    AllowedValues: ['128','256', '512', '1024', '2048', '3072', '4096', '5120', '6144', '7168', '8192']
    Description: RAM (en MB) para el contenedor 1

  MemoryContainer2:
    Type: String
    AllowedValues: ['128','256', '512', '1024', '2048', '3072', '4096', '5120', '6144', '7168', '8192']
    Description: RAM (en MB) para el contenedor 2

  MemoryContainer3:
    Type: String
    AllowedValues: ['128','256', '512', '1024', '2048', '3072', '4096', '5120', '6144', '7168', '8192']
    Description: RAM (en MB) para el contenedor 2

  Memory:
    Type: String
    AllowedValues: ['512', '1024', '2048', '3072', '4096', '5120', '6144', '7168', '8192']
    Description: RAM (en MB) para la tarea

  App1Port:
    Type: Number
    Description: Puerto para el contenedor 1

  App2Port:
    Type: Number
    Description: Puerto para el contenedor 2

  App3Port:
    Type: Number
    Description: Puerto para el contenedor 3

  DatabaseName:
    Type: String
    Description: Nombre de la base de datos

  DatabaseUser:
    Type: String
    Description: Usuario de la base de datos

  DatabasePassword:
    Type: String
    Description: Contraseña del usuario de la base de datos

  DatabaseHost:
    Type: String
    Description: Contraseña del root de la base de datos

  DatabasePort:
    Type: String
    Description: Puerto de la base de datos
  

Resources:

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup  
    Properties:
        GroupDescription: Allow HTTP Traffic
        VpcId: !Ref VPCId
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 80
            ToPort: 80
            CidrIp: 0.0.0.0/0


  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName

  ECSExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecsTaskExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy


  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: mi-task-def
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ECSExecutionRole.Arn
      ContainerDefinitions:
        - Name: WebServer
          Image: !Ref  Image1
          Essential: true
          Cpu: !Ref CpuContainer1
          Memory: !Ref MemoryContainer1
          PortMappings:
            - ContainerPort: !Ref App1Port
              Protocol: tcp

        - Name: Website
          Essential: false
          Image: !Ref Image2
          Cpu: !Ref CpuContainer2
          Memory: !Ref MemoryContainer2
          PortMappings:
            - ContainerPort: !Ref App2Port
              Protocol: tcp

          Environment:
            - Name: !Sub "${DatabaseEngine}_HOST"
              Value: !Ref DatabaseHost

            - Name: !Sub "${DatabaseEngine}_PORT"
              Value: !Ref DatabasePort

            - Name: !Sub "${DatabaseEngine}_DATABASE"
              Value: !Ref DatabaseName

            - Name: !Sub "${DatabaseEngine}_USER"
              Value: !Ref DatabaseUser

            - Name: !Sub "${DatabaseEngine}_PASSWORD"
              Value: !Ref DatabasePassword

            - Name: !Sub "${DatabaseEngine}_ROOT_PASSWORD"
              Value: !Ref DatabasePassword

        - Name: DataBase
          Essential: false
          Image: !Ref Image3
          Cpu: !Ref CpuContainer3
          Memory: !Ref MemoryContainer3
          PortMappings:
            - ContainerPort: !Ref App3Port
              Protocol: tcp
          

  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ECSCluster
    Properties:
      Cluster: !Ref ECSCluster
      LaunchType: FARGATE
      DesiredCount: 3
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnetId
          SecurityGroups:
            - !Ref InstanceSecurityGroup

Outputs:
  ServiceCluster:
    Description: Nombre del cluster ECS creado
    Value: !Ref ECSCluster

  ECSServiceName:
    Description: Nombre del servicio ECS creado
    Value: !Ref ECSService